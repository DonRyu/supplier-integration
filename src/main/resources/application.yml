spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/supplier}
    username: ${DB_USER:supplier}
    password: ${DB_PASSWORD:supplier}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

springdoc:
  swagger-ui:
    path: /swagger-ui.html
