<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Supplier Feed Integration</title>
    <style>
        :root {
            --bg: #f6f7f9;
            --card: #ffffff;
            --text: #1d2330;
            --muted: #667085;
            --border: #e4e7ec;
            --accent: #1f6feb;
            --ok: #12805c;
            --warn: #b54708;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
        }
        main { max-width: 960px; margin: 0 auto; padding: 32px 16px; }
        h1 { font-size: 22px; margin: 0 0 4px; }
        p.sub { color: var(--muted); margin: 0 0 24px; }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        h2 { font-size: 16px; margin: 0 0 16px; }
        form, .filters { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; }
        label { display: flex; flex-direction: column; font-size: 13px; color: var(--muted); gap: 4px; }
        input, select, button { font: inherit; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; }
        button { background: var(--accent); color: #fff; border: none; cursor: pointer; }
        button.secondary { background: #fff; color: var(--text); border: 1px solid var(--border); }
        #result { margin-top: 16px; font-size: 14px; }
        #result .ok { color: var(--ok); }
        #result ul { color: var(--warn); margin: 8px 0 0; padding-left: 20px; }
        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 16px; }
        th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--border); }
        th { color: var(--muted); font-weight: 600; }
        td.num { text-align: right; }
        tr.low td { color: var(--warn); }
        .links { font-size: 13px; color: var(--muted); }
        .links a { color: var(--accent); }
    </style>
</head>
<body>
<main>
    <h1>Supplier Feed Integration</h1>
    <p class="sub">Upload a supplier feed (CSV or XML). Fields are mapped to the internal product model and stored.</p>

    <section class="card">
        <h2>Import feed</h2>
        <form id="upload-form">
            <label>Supplier
                <input id="supplier" value="supplier-a" required>
            </label>
            <label>Format
                <select id="format">
                    <option value="CSV">CSV</option>
                    <option value="XML">XML</option>
                </select>
            </label>
            <label>File
                <input id="file" type="file" accept=".csv,.xml" required>
            </label>
            <button type="submit">Import</button>
        </form>
        <div id="result"></div>
    </section>

    <section class="card">
        <h2>Products</h2>
        <div class="filters">
            <label>Low stock below
                <input id="threshold" type="number" min="0" value="10">
            </label>
            <button class="secondary" id="show-low">Show low stock</button>
            <button class="secondary" id="show-all">Show all</button>
        </div>
        <div class="table-wrap">
            <table>
                <thead>
                <tr><th>SKU</th><th>Name</th><th>Supplier</th><th class="num">Qty</th><th class="num">Price</th></tr>
                </thead>
                <tbody id="products"></tbody>
            </table>
        </div>
    </section>

    <p class="links">API docs: <a href="/swagger-ui.html">Swagger UI</a></p>
</main>

<script>
    const tbody = document.getElementById('products');
    const result = document.getElementById('result');
    const thresholdInput = document.getElementById('threshold');

    function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, c => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[c]));
    }

    async function loadProducts(url) {
        const res = await fetch(url);
        const products = await res.json();
        const threshold = Number(thresholdInput.value);
        tbody.innerHTML = products.map(p => `
            <tr class="${p.quantity < threshold ? 'low' : ''}">
                <td>${escapeHtml(p.sku)}</td>
                <td>${escapeHtml(p.name)}</td>
                <td>${escapeHtml(p.supplier)}</td>
                <td class="num">${p.quantity}</td>
                <td class="num">$${Number(p.price).toFixed(2)}</td>
            </tr>`).join('') || '<tr><td colspan="5">No products yet.</td></tr>';
    }

    document.getElementById('upload-form').addEventListener('submit', async e => {
        e.preventDefault();
        const supplier = encodeURIComponent(document.getElementById('supplier').value.trim());
        const format = document.getElementById('format').value;
        const body = new FormData();
        body.append('file', document.getElementById('file').files[0]);

        const res = await fetch(`/api/feeds/${supplier}?format=${format}`, { method: 'POST', body });
        const data = await res.json();

        if (!res.ok) {
            result.innerHTML = `<ul><li>${escapeHtml(data.detail || 'Import failed')}</li></ul>`;
            return;
        }
        const errors = data.errors.map(err => `<li>${escapeHtml(err)}</li>`).join('');
        result.innerHTML = `<div class="ok">Created ${data.created}, updated ${data.updated}, rejected ${data.rejected}</div>`
            + (errors ? `<ul>${errors}</ul>` : '');
        loadProducts('/api/products');
    });

    document.getElementById('show-low').addEventListener('click', () =>
        loadProducts(`/api/products/low-stock?threshold=${thresholdInput.value}`));
    document.getElementById('show-all').addEventListener('click', () => loadProducts('/api/products'));

    loadProducts('/api/products');
</script>
</body>
</html>
