services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: supplier
      POSTGRES_USER: supplier
      POSTGRES_PASSWORD: supplier
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supplier -d supplier"]
      interval: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/supplier
      DB_USER: supplier
      DB_PASSWORD: supplier
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
